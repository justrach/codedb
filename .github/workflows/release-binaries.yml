name: release-binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload assets for (for example v0.2.53)
        required: true
        type: string

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.0-dev.813+2153f8143

jobs:
  build:
    name: build-${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            zig_host: x86_64-macos
            zig_sha256: 3938c46ae4bca3c13f423b09503e3ef00bb4b7ef12b8bc1e5122ede366057a5b
            zig_target: x86_64-macos
            asset_name: codedb-darwin-x86_64
          - runner: macos-14
            zig_host: aarch64-macos
            zig_sha256: 36673d2513afa4a96c86780648ba504beedd7f0451389091cf9d53e38d5b4840
            zig_target: aarch64-macos
            asset_name: codedb-darwin-arm64
          - runner: ubuntu-24.04
            zig_host: x86_64-linux
            zig_sha256: b0d46ffc4587b9e8dd0b524ee5bc4da1e67f28bba55e7c534cec64af2f2d7a74
            zig_target: x86_64-linux
            asset_name: codedb-linux-x86_64
          - runner: ubuntu-24.04
            zig_host: x86_64-linux
            zig_sha256: b0d46ffc4587b9e8dd0b524ee5bc4da1e67f28bba55e7c534cec64af2f2d7a74
            zig_target: aarch64-linux
            asset_name: codedb-linux-arm64
          - runner: ubuntu-24.04
            zig_host: x86_64-linux
            zig_sha256: b0d46ffc4587b9e8dd0b524ee5bc4da1e67f28bba55e7c534cec64af2f2d7a74
            zig_target: x86_64-windows
            asset_name: codedb-windows-x86_64.exe
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      CODEDB_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      # Base64-encoded App Store Connect API key plus its key/issuer IDs.
      # macOS jobs fail closed when any release credential is missing.
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pinned Zig
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq ".minimum_zig_version = \"${ZIG_VERSION}\"" build.zig.zon || {
            echo "release tag does not require the workflow's pinned Zig ${ZIG_VERSION}" >&2
            exit 1
          }
          archive="zig-${{ matrix.zig_host }}-${ZIG_VERSION}.tar.xz"
          zig_dir="zig-${{ matrix.zig_host }}-${ZIG_VERSION}"
          # Old dev builds are rotated off ziglang.org; fall back to the
          # hexops community mirror (byte-identical official tarballs).
          # The pinned sha256 below is verified regardless of source.
          curl --fail --show-error --location --retry 3 \
            "https://ziglang.org/builds/${archive}" -o zig.tar.xz || \
          curl --fail --show-error --location --retry 3 \
            "https://pkg.machengine.org/zig/${archive}" -o zig.tar.xz
          echo "${{ matrix.zig_sha256 }}  zig.tar.xz" | shasum -a 256 --check
          tar -xf zig.tar.xz
          test "$("$PWD/${zig_dir}/zig" version)" = "$ZIG_VERSION"
          echo "$PWD/${zig_dir}" >> "$GITHUB_PATH"

      - name: Require macOS release credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            CODEDB_CODESIGN_IDENTITY \
            APPLE_NOTARY_KEY_P8 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "missing required macOS release secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/codedb-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codedb-signing.keychain-db"
          export CERT_PATH
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          pathlib.Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE_P12"])
          )
          PY
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

      - name: Build ${{ matrix.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }} -Dcodesign-identity="$CODEDB_CODESIGN_IDENTITY"
          else
            zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}
          fi
          binary=zig-out/bin/codedb
          [[ -f "$binary" ]] || binary=zig-out/bin/codedb.exe
          test -f "$binary"
          cp "$binary" "${{ matrix.asset_name }}"

      - name: Verify and notarize macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.asset_name }}"
          codesign --verify --deep --strict --verbose=4 "$asset"
          codesign -dvv "$asset" 2>&1 | grep -Fq 'Authority=Developer ID Application:'
          codesign -dvv "$asset" 2>&1 | grep -Eq 'flags=0x[0-9a-fA-F]*10000\(runtime\)'

          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          archive="$RUNNER_TEMP/${asset}.zip"
          trap 'rm -f "$notary_key" "$archive"' EXIT
          printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$notary_key"
          chmod 600 "$notary_key"
          ditto -c -k --keepParent "$asset" "$archive"
          xcrun notarytool submit "$archive" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

          # Bare Mach-O executables cannot carry a stapled ticket. Wait for
          # Apple's online ticket lookup to recognize the exact code hash.
          for attempt in {1..30}; do
            if codesign -vvvv -R='notarized' --check-notarization "$asset"; then
              exit 0
            fi
            echo "notarization ticket is not visible yet (attempt ${attempt}/30)"
            sleep 10
          done
          echo "Apple accepted the submission but its ticket never became visible" >&2
          exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: upload-release-assets
    runs-on: ubuntu-24.04
    needs: build
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find dist -type f -name 'codedb-*' -exec cp {} assets/ \;
          (
            cd assets
            sha256sum codedb-* | sort > checksums.sha256
          )

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" assets/codedb-* assets/checksums.sha256 --clobber --repo "$GITHUB_REPOSITORY"
