name: cut-v0.2.5842
on:
  push:
    branches: [release/0.2.5842]
    paths:
      - ".github/workflows/cut-v0.2.5842.yml"
jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Tag, publish GitHub Release, start binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=7bba83cd7b4f2502375f3756ee66436c9aeb5c24
          git config user.name justrach
          git config user.email 54503978+justrach@users.noreply.github.com
          git tag -a v0.2.5842 "$SHA" -m v0.2.5842
          git push origin v0.2.5842
          gh release create v0.2.5842 --target "$SHA" \
            --title "v0.2.5842 — list_dir and one-shot surface" \
            --notes "Agent tools/list (mini) now advertises five one-shots: codedb_context, codedb_explain, codedb_callpath, codedb_list_dir, and codedb_status. Hop tools stay callable. codedb_list_dir is live BFS (gitignore, 10k cap). CLI explain/around compose definition+callers; path aliases callpath."
          gh workflow run release-binaries.yml --ref main -f tag=v0.2.5842 || true
          git fetch origin release/0.2.5842
          git checkout release/0.2.5842
          git rm .github/workflows/cut-v0.2.5842.yml
          git commit -m "chore: remove one-shot tag cutter"
          git push origin release/0.2.5842
